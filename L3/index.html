<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Présences — L3</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: #04101c; color: #16202b;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .bg-photo {
    position: fixed; inset: 0; z-index: -2;
    background-image: url(../assets/fond-plongeurs.jpg);
    background-size: cover; background-position: center;
  }
  header {
    background: linear-gradient(180deg, rgba(3,12,22,0.6) 0%, rgba(3,12,22,0.32) 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff; padding: 16px 16px 14px 16px;
    position: sticky; top: 0; z-index: 5;
    text-shadow: 0 1px 6px rgba(0,0,0,.3);
  }
  header .eyebrow {
    display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    color: rgba(255,255,255,.82); margin-bottom: 2px;
  }
  header .titre {
    display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px;
  }
  main { padding: 14px; padding-bottom: 96px; max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  .card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: 0 8px 24px rgba(3,12,22,0.18);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  }
  select, input[type=text] {
    width: 100%; padding: 10px; font-size: 16px;
    background: rgba(255,255,255,0.5); color: #16202b;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 8px; margin-top: 4px;
  }
  label { font-size: 13px; color: rgba(22,32,43,0.65); display: block; margin-top: 10px; }
  .encadrant-info { font-size: 13px; color: rgba(22,32,43,0.75); margin-top: 8px; min-height: 16px; }
  .encadrant-info strong { color: #0f6e6a; }
  .roster-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px; border-bottom: 1px solid rgba(22,32,43,0.1);
  }
  .roster-item:last-child { border-bottom: none; }
  .roster-item button {
    background: #0f6e6a; color: #fff; border: none; border-radius: 6px;
    padding: 8px 12px; font-size: 14px;
  }
  .present-item {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: 0 8px 24px rgba(3,12,22,0.18);
    border-radius: 14px; padding: 10px 14px; margin-bottom: 10px;
  }
  .present-item .top {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600;
  }
  .present-item .top button {
    background: none; border: none; color: rgba(22,32,43,0.55); font-size: 22px;
    line-height: 1; padding: 0 2px; cursor: pointer;
  }
  .present-item .top button:hover { color: #a33; }
  .present-item select, .present-item input {
    margin-top: 6px; font-size: 14px; padding: 6px;
  }
  .present-item.invite {
    background: rgba(255,236,206,0.6); border-color: rgba(240,180,100,0.55);
  }
  .badge-invite, .tag-invite {
    display: inline-block; font-size: 11px; font-weight: 600; font-style: normal;
    color: #7a4a12; background: rgba(247,200,120,0.85); border-radius: 4px;
    padding: 2px 6px; margin-left: 6px; vertical-align: middle;
  }
  .fixed-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(3,12,22,0) 0%, rgba(3,12,22,0.6) 55%);
    padding: 14px 16px 22px 16px; z-index: 5;
  }
  .fixed-bar button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    background: #0f6e6a; color: #fff; border: none; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(3,12,22,0.3);
  }
  .fixed-bar button:disabled { background: #7a8a86; }
  #msg { font-size: 13px; margin-top: 6px; min-height: 18px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #msg.err { color: #ffb4b4; }
  #msg.ok { color: #bdf0d8; }
  #signin { padding: 30px 16px; text-align: center; }
  #signin p { color: #16202b; }
  #app { display: none; }
</style>
</head>
<body>


<div class="bg-photo"></div>
<header><span class="eyebrow">Suivi des présences</span><span class="titre">L3 — Confirmé</span></header>

<main>
  <div id="signin" class="card">
    <p>Connexion avec votre compte Google du club.</p>
    <div id="g_id_signin"></div>
  </div>

  <div id="app">
    <div class="card">
      <label for="seance">Séance</label>
      <select id="seance"></select>
      <div id="encadrant" class="encadrant-info"></div>
    </div>

    <div class="card">
      <label for="recherche">Ajouter un présent</label>
      <input type="text" id="recherche" placeholder="Nom ou prénom…" autocomplete="off">
      <div id="suggestions"></div>
    </div>

    <div class="card">
      <div id="presents"></div>
      <p id="vide" style="color:#888;font-size:14px;">Aucun présent ajouté pour l'instant.</p>
    </div>
  </div>
</main>

<div class="fixed-bar" id="bar" style="display:none;">
  <button id="btnSave">Enregistrer la séance</button>
  <div id="msg"></div>
</div>

<script>
// --- À renseigner après déploiement -------------------------------------
// Script STANDALONE unique (Code.gs), un seul code source pour toutes les
// lignes et tous les environnements. Mais un déploiement distinct par
// palier DEV/TEST/PROD (Gérer les déploiements, dans script.google.com) :
// chaque palier a donc SA PROPRE URL /exec, partagée seulement entre les
// lignes de ce même palier. Le paramétrage cible -> classeur se trouve
// dans Code.gs (objet CLASSEURS), pas ici.
var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxTeOKaPx53j2exXGt6Hql8BIe22WRzxTqCiY3gpe60gvRmj8BanUjIH9tsrnoCsPw94g/exec";
var GOOGLE_CLIENT_ID = "490347116418-0outack1od53036gfeca2enatbopogfm.apps.googleusercontent.com";
var CIBLE = "PROD-L3";
// -------------------------------------------------------------------------

var idToken = null;
var roster = [];
var seances = [];
var presents = {};   // apneiste_id -> {id, nom, prenom, qualite, observation}
var presentsOrder = [];  // ordre d'affichage : dernier ajoute en tete (demande du 06/09/2026)

function handleCredentialResponse(resp) {
  idToken = resp.credential;
  document.getElementById('signin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bar').style.display = 'block';
  chargerDonnees();
}

window.onload = function () {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true
  });
  google.accounts.id.renderButton(
    document.getElementById('g_id_signin'),
    { theme: 'filled_blue', size: 'large', width: 280 }
  );
};

function chargerDonnees() {
  fetch(WEB_APP_URL + '?action=data&cible=' + encodeURIComponent(CIBLE), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { afficherMessage(d.error, true); return; }
      roster = d.roster;
      seances = d.seances;
      remplirSeances();
    })
    .catch(function (e) { afficherMessage('Erreur de chargement : ' + e, true); });
}

function remplirSeances() {
  var sel = document.getElementById('seance');
  sel.innerHTML = '';
  // ordre chronologique, la plus ancienne en haut (demande du 07/09/2026)
  seances.forEach(function (s) {
    var opt = document.createElement('option');
    opt.value = s.id;
    var horaire = (s.heure_debut && s.heure_fin) ? (s.heure_debut + ' - ' + s.heure_fin) : '';
    opt.textContent = s.numero + ' . ' + s.jour + ' ' + s.date + (horaire ? ' . ' + horaire : '');
    sel.appendChild(opt);
  });
  sel.onchange = ouvrirSeance;
  if (seances.length) {
    // selection par defaut : la seance la plus recente deja passee (ou en
    // cours), sinon la premiere de la liste — plus pratique que "la
    // premiere ligne" maintenant que l'ordre est chronologique croissant.
    var todayIso = new Date().toISOString().slice(0, 10);
    var defaut = seances[0].id;
    seances.forEach(function (s) {
      if (s.date_iso && s.date_iso <= todayIso) defaut = s.id;
    });
    sel.value = defaut;
    ouvrirSeance();
  }
}

// Encadrant de la seance selectionnee : le remplacant s'il est precise
// dans le Calendrier, sinon l'encadrant habituel du creneau — deduit
// cote serveur (Code.gs), affiche tel quel ici (demande du 07/09/2026).
function afficherEncadrant() {
  var s = seances.filter(function (x) { return x.id === document.getElementById('seance').value; })[0];
  var el = document.getElementById('encadrant');
  if (s && (s.encadrant_prenom || s.encadrant_nom)) {
    el.innerHTML = 'Encadrant : <strong>' + (s.encadrant_prenom + ' ' + s.encadrant_nom).trim() + '</strong>';
  } else {
    el.textContent = '';
  }
}

function ouvrirSeance() {
  presents = {};
  presentsOrder = [];
  render();
  afficherEncadrant();
  var seanceId = document.getElementById('seance').value;
  fetch(WEB_APP_URL + '?action=fiche&cible=' + encodeURIComponent(CIBLE) +
        '&seance=' + encodeURIComponent(seanceId), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { afficherMessage(d.error, true); return; }
      d.presences.forEach(function (p) {
        // la fiche renvoyee par le serveur n'indique pas si la personne est
        // membre de la ligne : on le retrouve via le roster deja charge
        // (demande "invite" du 07/09/2026).
        var ref = roster.filter(function (r) { return r.id === p.apneiste_id; })[0];
        p.membre = ref ? ref.membre !== false : true;
        presents[p.apneiste_id] = p;
        presentsOrder.push(String(p.apneiste_id));
      });
      render();
    });
}

document.getElementById('recherche').addEventListener('input', function (e) {
  var q = e.target.value.trim().toLowerCase();
  var box = document.getElementById('suggestions');
  box.innerHTML = '';
  if (!q) return;
  var matches = roster.filter(function (p) {
    return !presents[p.id] &&
      (p.nom.toLowerCase().indexOf(q) === 0 || p.prenom.toLowerCase().indexOf(q) === 0);
  }).slice(0, 8);
  matches.forEach(function (p) {
    var div = document.createElement('div');
    div.className = 'roster-item';
    div.innerHTML = '<span>' + p.prenom + ' ' + p.nom +
      (p.membre === false ? ' <em class="tag-invite">invite</em>' : '') + '</span>';
    var btn = document.createElement('button');
    btn.textContent = 'Ajouter';
    btn.onclick = function () {
      presents[p.id] = { apneiste_id: p.id, nom: p.nom, prenom: p.prenom,
                         membre: p.membre !== false, qualite: '', observation: '' };
      presentsOrder.unshift(String(p.id));   // ajout en tete de liste (demande du 06/09/2026)
      document.getElementById('recherche').value = '';
      box.innerHTML = '';
      render();
    };
    div.appendChild(btn);
    box.appendChild(div);
  });
});

function render() {
  var wrap = document.getElementById('presents');
  var vide = document.getElementById('vide');
  wrap.innerHTML = '';
  var ids = presentsOrder;
  vide.style.display = ids.length ? 'none' : 'block';
  ids.forEach(function (id) {
    var p = presents[id];
    var estInvite = p.membre === false;
    var div = document.createElement('div');
    div.className = 'present-item' + (estInvite ? ' invite' : '');
    div.innerHTML =
      '<div class="top"><span>' + p.prenom + ' ' + p.nom +
      (estInvite ? ' <span class="badge-invite">invité</span>' : '') + '</span>' +
      '<button data-id="' + id + '" class="retirer" aria-label="Retirer">&times;</button></div>' +
      '<select data-id="' + id + '" class="qualite">' +
        '<option value="">Zone de confort (facultatif)</option>' +
        '<option value="Hors zone"' + (p.qualite === 'Hors zone' ? ' selected' : '') + '>Hors zone</option>' +
        '<option value="En limite"' + (p.qualite === 'En limite' ? ' selected' : '') + '>En limite</option>' +
        '<option value="Dans la zone"' + (p.qualite === 'Dans la zone' ? ' selected' : '') + '>Dans la zone</option>' +
      '</select>' +
      '<input type="text" data-id="' + id + '" class="observation" placeholder="Observation (facultatif)" value="' +
        (p.observation || '').replace(/"/g, '&quot;') + '">';
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('.retirer').forEach(function (b) {
    b.onclick = function () {
      delete presents[b.dataset.id];
      presentsOrder = presentsOrder.filter(function (x) { return x !== b.dataset.id; });
      render();
    };
  });
  wrap.querySelectorAll('.qualite').forEach(function (s) {
    s.onchange = function () { presents[s.dataset.id].qualite = s.value; };
  });
  wrap.querySelectorAll('.observation').forEach(function (i) {
    i.oninput = function () { presents[i.dataset.id].observation = i.value; };
  });
}

document.getElementById('btnSave').addEventListener('click', function () {
  var btn = this;
  btn.disabled = true;
  afficherMessage('Enregistrement…', false);
  var payload = {
    action: 'saveSeance',
    cible: CIBLE,
    idToken: idToken,
    seance_id: document.getElementById('seance').value,
    presences: presentsOrder.map(function (id) {
      var p = presents[id];
      return { apneiste_id: id, present: true, qualite: p.qualite, observation: p.observation };
    })
  };
  fetch(WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // evite le preflight CORS
    body: JSON.stringify(payload)
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      btn.disabled = false;
      if (!d.ok) { afficherMessage(d.error, true); return; }
      afficherMessage(d.saved + ' présence(s) enregistrée(s).', false);
    })
    .catch(function (e) {
      btn.disabled = false;
      afficherMessage('Échec de l\'enregistrement : ' + e, true);
    });
});

function afficherMessage(txt, isErr) {
  var m = document.getElementById('msg');
  m.textContent = txt;
  m.className = isErr ? 'err' : 'ok';
}
</script>
</body>
</html>
