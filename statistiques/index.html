<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Statistiques du club</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #04101c; color: #16202b; font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .bg { position: fixed; inset: 0; z-index: -1; background: linear-gradient(145deg, rgba(3,16,28,.84), rgba(8,55,59,.58)), url(../assets/fond-plongeurs.jpg) center / cover; }
  header { padding: 20px max(18px, calc((100vw - 900px) / 2)); color: #fff; }
  .eyebrow { display: block; font: 600 12px 'Space Grotesk', sans-serif; letter-spacing: .05em; text-transform: uppercase; opacity: .82; }
  h1 { margin: 4px 0 0; font: 700 27px 'Space Grotesk', sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 10px 18px 48px; }
  .card { padding: 18px; border: 1px solid rgba(255,255,255,.42); border-radius: 18px; background: rgba(244,250,250,.94); box-shadow: 0 12px 32px rgba(0,0,0,.2); }
  #signin { max-width: 390px; margin: 42px auto; text-align: center; }
  #signin p { margin: 0 0 16px; }
  #app { display: none; }
  .intro { margin: 0 0 14px; color: #455860; font-size: 14px; }
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { padding: 14px; border-radius: 14px; background: #fff; border: 1px solid rgba(15,110,106,.16); }
  .kpi strong { display: block; color: #0f6e6a; font: 700 25px 'Space Grotesk', sans-serif; white-space: nowrap; }
  .kpi span { font-size: 13px; color: #5b6470; }
  h2 { margin: 23px 0 10px; font: 700 19px 'Space Grotesk', sans-serif; }
  .comparison { overflow: hidden; border-radius: 14px; border: 1px solid rgba(15,110,106,.16); background: #fff; }
  .row { display: grid; grid-template-columns: 74px minmax(120px, 1fr) 100px 82px; gap: 12px; align-items: center; padding: 13px 14px; border-bottom: 1px solid rgba(22,32,43,.09); }
  .row:last-child { border-bottom: 0; }
  .row-head { padding-top: 9px; padding-bottom: 9px; background: #edf5f4; color: #53656b; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .line-name { font-weight: 700; }
  .bar-wrap { display: flex; gap: 9px; align-items: center; min-width: 0; }
  .track { flex: 1; height: 10px; overflow: hidden; border-radius: 99px; background: #dcebea; }
  .bar { min-width: 3px; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #0f6e6a, #3eaaa3); }
  .average { color: #0f5754; font-weight: 700; white-space: nowrap; }
  .number { text-align: right; }
  .notice { margin: 18px 0 0; color: #5b6470; font-size: 12px; }
  .comparison-tools { display: flex; justify-content: flex-end; margin: -2px 0 8px; }
  .comparison-tools button { border: 1px solid rgba(15,110,106,.25); border-radius: 999px; padding: 7px 11px; color: #0f5754; background: #fff; font: 600 12px Manrope, sans-serif; cursor: pointer; }
  .line-detail { margin: 0; overflow: hidden; border: 0; border-radius: 0; background: #fff; }
  .line-detail summary { position: relative; display: grid; grid-template-columns: 74px minmax(120px, 1fr) 100px 82px; gap: 12px; align-items: center; padding: 13px 38px 13px 14px; cursor: pointer; list-style: none; border-bottom: 1px solid rgba(22,32,43,.09); }
  .line-detail summary::-webkit-details-marker { display: none; }
  .line-detail summary::after { content: '›'; position: absolute; right: 14px; top: 50%; color: #0f5754; font-size: 20px; line-height: 1; transform: translateY(-50%); transition: transform .15s ease; }
  .line-detail[open] summary::after { transform: translateY(-50%) rotate(90deg); }
  .line-detail summary:hover { background: #f7fbfa; }
  .line-name { display: flex; align-items: center; }
  .line-detail.unavailable summary { cursor: default; color: #5b6470; }
  .line-detail.unavailable summary::after { visibility: hidden; }
  .detail-body { padding: 0 14px 14px; border-top: 1px solid rgba(22,32,43,.09); }
  .detail-body h3 { margin: 15px 0 8px; font: 700 14px 'Space Grotesk', sans-serif; }
  .weekday-row { display: grid; grid-template-columns: 80px 1fr 58px; gap: 8px; align-items: center; margin: 8px 0; font-size: 12px; }
  .todo-list { margin: 0; padding: 0; list-style: none; }
  .todo-list li { padding: 8px 0; border-bottom: 1px solid rgba(22,32,43,.09); font-size: 12px; }
  .todo-list li:last-child { border-bottom: 0; }
  .todo-list strong { color: #0f5754; }
  .empty { color: #5b6470; font-size: 12px; }
  #message { margin: 18px 0; color: #fff; text-align: center; }
  @media (max-width: 600px) {
    header { padding: 18px; } h1 { font-size: 23px; } main { padding: 6px 12px 32px; }
    .card { padding: 14px; border-radius: 15px; } .summary { gap: 7px; } .kpi { padding: 10px 8px; } .kpi strong { font-size: 17px; } .kpi span { font-size: 11px; }
    .row { grid-template-columns: 54px minmax(92px, 1fr) 55px; gap: 7px; padding: 12px 9px; font-size: 12px; }
    .row > :nth-child(4) { display: none; } .row-head > :nth-child(4) { display: none; }
    .bar-wrap { gap: 5px; } .average { font-size: 11px; } .number { font-size: 11px; }
    .line-detail summary { grid-template-columns: 54px minmax(92px, 1fr) 55px; gap: 7px; padding: 12px 9px; font-size: 12px; } .line-detail summary > :nth-child(4) { display: none; } .weekday-row { grid-template-columns: 72px 1fr 52px; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<header><span class="eyebrow">Suivi des présences</span><h1>Statistiques du club</h1></header>
<main>
  <section id="signin" class="card"><p>Cette vue est réservée à Frédéric et aux responsables du club.</p><div id="g_id_signin"></div></section>
  <div id="message" role="alert"></div>
  <section id="app" class="card">
    <p class="intro" id="rule"></p>
    <div id="summary" class="summary"></div>
    <h2>Comparaison des lignes</h2>
    <div class="comparison-tools"><button id="toggleAll" type="button">Tout déplier</button></div>
    <div id="comparison" class="comparison"></div>
    <p class="notice">La page ne présente que des données agrégées par ligne. Les données proviennent des classeurs de production, en lecture seule.</p>
  </section>
</main>
<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxTeOKaPx53j2exXGt6Hql8BIe22WRzxTqCiY3gpe60gvRmj8BanUjIH9tsrnoCsPw94g/exec';
var GOOGLE_CLIENT_ID = '490347116418-0outack1od53036gfeca2enatbopogfm.apps.googleusercontent.com';
function formatAverage(value) { return String(value).replace('.', ',') + ' pers.'; }
function showMessage(text) { document.getElementById('message').textContent = text; }
function handleCredentialResponse(response) {
  showMessage('Chargement des statistiques…');
  fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'statsClub', environnement: 'PROD', idToken: response.credential }) })
    .then(function (r) { return r.json(); })
    .then(function (data) { if (!data.ok) throw new Error(data.error || 'accès indisponible'); render(data); })
    .catch(function (error) { showMessage(error.message || 'Impossible de charger les statistiques.'); });
}
function render(data) {
  document.getElementById('message').textContent = '';
  document.getElementById('signin').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('rule').textContent = data.regle + '.';
  var summary = document.getElementById('summary'); summary.textContent = '';
  [[formatAverage(data.moyenne), 'Moyenne par séance'], [String(data.seances) + ' séances', 'Tenues'], [String(data.a_completer) + ' séances', 'À compléter']].forEach(function (item) {
    var card = document.createElement('div'); card.className = 'kpi'; var value = document.createElement('strong'); value.textContent = item[0]; var label = document.createElement('span'); label.textContent = item[1]; card.appendChild(value); card.appendChild(label); summary.appendChild(card);
  });
  var lines = (data.lignes || []).concat((data.lignes_attente || []).map(function (code) { return { code: code, indisponible: true }; }));
  var maxAverage = Math.max.apply(null, lines.filter(function (line) { return !line.indisponible; }).map(function (line) { return line.moyenne; })) || 1;
  var maxWeekday = Math.max.apply(null, lines.reduce(function (all, line) { return all.concat(line.hebdomadaire || []); }, []).map(function (day) { return day.moyenne; })) || 1;
  var comparison = document.getElementById('comparison'); comparison.textContent = '';
  var head = document.createElement('div'); head.className = 'row row-head'; ['Ligne', 'Fréquentation', 'Tenues', 'À compléter'].forEach(function (value) { var cell = document.createElement('span'); cell.textContent = value; head.appendChild(cell); }); comparison.appendChild(head);
  lines.forEach(function (line) { comparison.appendChild(createLineDetail(line, maxAverage, maxWeekday)); });
  var toggle = document.getElementById('toggleAll');
  function refreshToggle() { toggle.textContent = comparison.querySelectorAll('details.line-detail:not([open]):not(.unavailable)').length ? 'Tout déplier' : 'Tout replier'; }
  toggle.onclick = function () { var open = toggle.textContent === 'Tout replier'; comparison.querySelectorAll('details.line-detail:not(.unavailable)').forEach(function (detail) { detail.open = !open; }); refreshToggle(); };
  comparison.querySelectorAll('details.line-detail:not(.unavailable)').forEach(function (detail) { detail.addEventListener('toggle', refreshToggle); });
  refreshToggle();
}
function createLineDetail(line, maxAverage, maxWeekday) {
  var detail = document.createElement('details'); detail.className = 'line-detail' + (line.indisponible ? ' unavailable' : '');
  var summary = document.createElement('summary');
  var name = document.createElement('span'); name.className = 'line-name'; name.textContent = line.code;
  var chart = document.createElement('div'); chart.className = 'bar-wrap';
  if (line.indisponible) { chart.textContent = 'À configurer'; }
  else { var track = document.createElement('div'); track.className = 'track'; var bar = document.createElement('div'); bar.className = 'bar'; bar.style.width = Math.round((line.moyenne / maxAverage) * 100) + '%'; track.appendChild(bar); var avg = document.createElement('span'); avg.className = 'average'; avg.textContent = formatAverage(line.moyenne); chart.appendChild(track); chart.appendChild(avg); }
  var held = document.createElement('span'); held.className = 'number'; held.textContent = line.indisponible ? '—' : line.seances;
  var pending = document.createElement('span'); pending.className = 'number'; pending.textContent = line.indisponible ? '—' : line.a_completer;
  summary.appendChild(name); summary.appendChild(chart); summary.appendChild(held); summary.appendChild(pending); detail.appendChild(summary);
  if (line.indisponible) return detail;
  var body = document.createElement('div'); body.className = 'detail-body';
  var weekTitle = document.createElement('h3'); weekTitle.textContent = 'Moyenne par jour de la semaine'; body.appendChild(weekTitle);
  if (!line.hebdomadaire || !line.hebdomadaire.length) { var emptyWeek = document.createElement('p'); emptyWeek.className = 'empty'; emptyWeek.textContent = 'Aucune séance tenue pour le moment.'; body.appendChild(emptyWeek); }
  else line.hebdomadaire.forEach(function (day) { var row = document.createElement('div'); row.className = 'weekday-row'; var label = document.createElement('span'); label.textContent = day.libelle; var track = document.createElement('div'); track.className = 'track'; var bar = document.createElement('div'); bar.className = 'bar'; bar.style.width = Math.round((day.moyenne / maxWeekday) * 100) + '%'; track.appendChild(bar); var value = document.createElement('span'); value.className = 'average'; value.textContent = formatAverage(day.moyenne); row.appendChild(label); row.appendChild(track); row.appendChild(value); body.appendChild(row); });
  var todoTitle = document.createElement('h3'); todoTitle.textContent = 'Séances à compléter'; body.appendChild(todoTitle);
  if (!line.seances_a_completer || !line.seances_a_completer.length) { var emptyTodo = document.createElement('p'); emptyTodo.className = 'empty'; emptyTodo.textContent = 'Aucune séance passée à compléter.'; body.appendChild(emptyTodo); }
  else { var list = document.createElement('ul'); list.className = 'todo-list'; line.seances_a_completer.forEach(function (session) { var item = document.createElement('li'); var date = document.createElement('strong'); date.textContent = session.date; item.appendChild(date); item.appendChild(document.createTextNode(' · ' + session.encadrant)); list.appendChild(item); }); body.appendChild(list); }
  detail.appendChild(body); return detail;
}
window.onload = function () { google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse, auto_select: true }); google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'filled_blue', size: 'large', width: 280 }); };
</script>
</body>
</html>
